<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Article — Ibnnak</title>
<meta name="description" content="Ibnnak — reading notes, new arrivals and stories from the bookshop.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f6f0e2; --card:#fffdf7; --ink:#232a22; --muted:#7d7466;
    --brand:#1f5138; --brand-dark:#143c29; --gold:#b97e1e; --gold-soft:#f0e3c0;
    --line:#e3d7bd;
    --shadow:0 10px 30px rgba(31,60,40,.10); --radius:14px;
    --header-bg:rgba(246,240,226,.94);
  }
  [data-theme="dark"]{
    --bg:#10160f; --card:#1a211a; --ink:#ede6d4; --muted:#a99e86;
    --brand:#6faf8b; --brand-dark:#589a76; --gold:#d9a94a; --gold-soft:#2e2a14;
    --line:#2e362c;
    --shadow:0 10px 30px rgba(0,0,0,.45);
    --header-bg:rgba(16,22,15,.94);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;background:var(--bg);color:var(--ink);line-height:1.65}
  h1,h2,.serif{font-family:'Fraunces',Georgia,'Times New Roman',serif}
  img{display:block;max-width:100%}
  a{color:inherit}
  .wrap{max-width:760px;margin:0 auto;padding:0 20px}
  .wrap-wide{max-width:1160px;margin:0 auto;padding:0 20px}

  header{position:sticky;top:0;z-index:50;background:var(--header-bg);
    backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
  .nav{display:flex;align-items:center;justify-content:space-between;height:68px;gap:16px}
  .brand{flex:none}
  .brand{font-family:'Fraunces',Georgia,serif;font-size:1.45rem;font-weight:700;
    color:var(--brand);text-decoration:none;letter-spacing:.02em}
  .brand small{display:block;font-family:'Inter',sans-serif;font-size:.62rem;font-weight:500;
    letter-spacing:.32em;color:var(--muted);text-transform:uppercase}
  .nav-links{display:flex;gap:20px}
  .nav-links a{text-decoration:none;font-size:.9rem;font-weight:500;color:var(--ink);opacity:.8;white-space:nowrap}
  .nav-links a:hover{opacity:1;color:var(--brand)}
  .nav-links a.here{opacity:1;color:var(--brand);font-weight:600}
  @media(max-width:900px){.nav-links{display:none}}
  .theme-btn{background:transparent;border:1.5px solid var(--line);color:var(--ink);
    width:42px;height:42px;border-radius:999px;cursor:pointer;display:inline-flex;
    align-items:center;justify-content:center}
  .theme-btn:hover{border-color:var(--brand);color:var(--brand)}

  main{padding:56px 0 72px}
  .back{display:inline-block;text-decoration:none;color:var(--brand);font-weight:600;
    font-size:.9rem;margin-bottom:26px}
  .back:hover{text-decoration:underline}
  .pdate{font-size:.78rem;color:var(--gold);font-weight:600;letter-spacing:.08em;
    text-transform:uppercase;margin-bottom:12px}
  article h1{font-size:clamp(1.9rem,5vw,2.7rem);line-height:1.2;color:var(--brand);margin-bottom:18px}
  article .hero-img{width:100%;border-radius:var(--radius);margin:6px 0 28px;box-shadow:var(--shadow)}
  article .body p{margin-bottom:18px;font-size:1.02rem;color:var(--ink)}
  .state{background:var(--card);border:1.5px dashed var(--line);border-radius:var(--radius);
    padding:56px 24px;text-align:center;color:var(--muted)}
  .state h2{color:var(--brand);font-size:1.5rem;margin-bottom:8px}

  footer{background:#16241b;color:#b3ab96;text-align:center;padding:34px 20px;font-size:.88rem}
  footer .brand{color:#ecdfba;font-size:1.2rem}
  footer nav{margin:14px 0;display:flex;gap:20px;justify-content:center;flex-wrap:wrap}
  footer nav a{color:#b3ab96;text-decoration:none}
  footer nav a:hover{color:#fff}
  button{-webkit-tap-highlight-color:transparent;touch-action:manipulation}
  @media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<header>
  <div class="wrap-wide nav">
    <a class="brand" href="index.html">Ibnnak<small>Bookstore</small></a>
    <nav class="nav-links">
      <a href="index.html">Home Page</a>
      <a href="books.html">Books</a>
      <a href="articles.html" class="here">Articles</a>
      <a href="quotations.html">Quotations</a>
      <a href="videos.html">Videos</a>
      <a href="palmistry.html">Palmistry</a>
    </nav>
    <button class="theme-btn" id="themeToggle" aria-label="Switch to dark mode"></button>
  </div>
</header>

<main>
  <div class="wrap">
    <a class="back" href="articles.html">← All articles</a>
    <div id="articleRoot">
      <div class="state"><h2>Loading…</h2><p>Fetching this article.</p></div>
    </div>
  </div>
</main>

<footer>
  <div class="wrap-wide">
    <div class="brand serif">Ibnnak</div>
    <nav>
      <a href="index.html">Home Page</a><a href="books.html">Books</a><a href="articles.html">Articles</a>
      <a href="quotations.html">Quotations</a><a href="videos.html">Videos</a><a href="palmistry.html">Palmistry</a>
    </nav>
    <div>© <span id="yr"></span> Ibnnak. All rights reserved.</div>
  </div>
</footer>

<script src="firebase-config.js"></script>
<script>
/* Theme (shared with the shop — same localStorage key) */
(function(){
  var MOON = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>';
  var SUN = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
  var btn = document.getElementById("themeToggle");
  function apply(t){
    document.documentElement.dataset.theme = t;
    try{ localStorage.setItem("abk_theme", t); }catch(e){}
    btn.innerHTML = t === "dark" ? SUN : MOON;
    btn.setAttribute("aria-label", t === "dark" ? "Switch to light mode" : "Switch to dark mode");
  }
  var saved = "light";
  try{ saved = localStorage.getItem("abk_theme") || "light"; }catch(e){}
  apply(saved);
  btn.addEventListener("click", function(){
    apply(document.documentElement.dataset.theme === "dark" ? "light" : "dark");
  });
  document.getElementById("yr").textContent = new Date().getFullYear();
})();
</script>
<script type="importmap">
{"imports":{
  "firebase/app":"https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js",
  "firebase/firestore":"https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js"
}}
</script>
<script type="module">
import { initializeApp } from "firebase/app";
import { getFirestore, getDoc, doc } from "firebase/firestore";

const root = document.getElementById("articleRoot");
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

function showState(title, text){
  root.innerHTML = `<div class="state"><h2>${esc(title)}</h2><p>${esc(text)}</p></div>`;
}
function fmtDate(ts){
  try{ return ts && ts.toDate ? ts.toDate().toLocaleDateString("en-GB", {day:"numeric", month:"long", year:"numeric"}) : ""; }
  catch(e){ return ""; }
}

(async function(){
  const id = new URLSearchParams(location.search).get("id");
  if (!id){ showState("No article selected", "This link is missing its article. Head back to the blog on the homepage."); return; }
  if (typeof FIREBASE_CONFIGURED === "undefined" || !FIREBASE_CONFIGURED){
    showState("Article not available yet", "The bookshop is still being set up — please check back soon.");
    return;
  }
  try{
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app, "default");
    const snap = await getDoc(doc(db, "posts", id));
    if (!snap.exists()){ showState("Article not found", "This article may have been moved or removed."); return; }
    const p = snap.data();
    document.title = (p.title || "Article") + " — Ibnnak";
    const date = fmtDate(p.createdAt);
    const paras = String(p.body || "").split(/\n\s*\n|\n/).map(s => s.trim()).filter(Boolean);
    root.innerHTML = `
      <article>
        ${date ? `<div class="pdate">${esc(date)}</div>` : ""}
        <h1>${esc(p.title || "")}</h1>
        ${p.imageUrl ? `<img class="hero-img" src="${esc(p.imageUrl)}" alt="">` : ""}
        <div class="body">${paras.map(t => `<p>${esc(t)}</p>`).join("")}</div>
      </article>`;
  }catch(e){
    console.warn("[Ibnnak] Could not load article:", e.message);
    showState("Could not load this article", "Please check your connection and try again.");
  }
})();
</script>
</body>
</html>
