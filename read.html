<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Read Online — Ibnnak</title>
<meta name="description" content="Ibnnak — a free online library. Read this book online, free, page by page.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f6f0e2; --card:#fffdf7; --ink:#232a22; --muted:#7d7466;
    --brand:#1f5138; --brand-dark:#143c29; --gold:#b97e1e; --gold-soft:#f0e3c0;
    --line:#e3d7bd;
    --shadow:0 10px 30px rgba(31,60,40,.10); --radius:14px;
    --header-bg:rgba(246,240,226,.94);
  }
  [data-theme="dark"]{
    --bg:#10160f; --card:#1a211a; --ink:#ede6d4; --muted:#a99e86;
    --brand:#6faf8b; --brand-dark:#589a76; --gold:#d9a94a; --gold-soft:#2e2a14;
    --line:#2e362c;
    --shadow:0 10px 30px rgba(0,0,0,.45);
    --header-bg:rgba(16,22,15,.94);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;background:var(--bg);color:var(--ink);line-height:1.65}
  h1,h2,.serif{font-family:'Fraunces',Georgia,'Times New Roman',serif}
  img{display:block;max-width:100%}
  a{color:inherit}
  .wrap{max-width:760px;margin:0 auto;padding:0 20px}
  .wrap-wide{max-width:1160px;margin:0 auto;padding:0 20px}
  header{position:sticky;top:0;z-index:50;background:var(--header-bg);
    backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
  .nav{display:flex;align-items:center;justify-content:space-between;height:68px;gap:16px}
  .brand{font-family:'Fraunces',Georgia,serif;font-size:1.45rem;font-weight:700;
    color:var(--brand);text-decoration:none;letter-spacing:.02em;flex:none}
  .brand small{display:block;font-family:'Inter',sans-serif;font-size:.62rem;font-weight:500;
    letter-spacing:.32em;color:var(--muted);text-transform:uppercase}
  .nav-links{display:flex;gap:20px}
  .nav-links a{text-decoration:none;font-size:.9rem;font-weight:500;color:var(--ink);opacity:.8;white-space:nowrap}
  .nav-links a:hover{opacity:1;color:var(--brand)}
  .nav-links a.here{opacity:1;color:var(--brand);font-weight:600}
  @media(max-width:900px){.nav-links{display:none}}
  .theme-btn{background:transparent;border:1.5px solid var(--line);color:var(--ink);
    width:42px;height:42px;border-radius:999px;cursor:pointer;display:inline-flex;
    align-items:center;justify-content:center;flex:none}
  .theme-btn:hover{border-color:var(--brand);color:var(--brand)}
  main{padding:32px 0 72px}
  .reader-bar{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;
    padding:14px 0 20px;border-bottom:1px solid var(--line);margin-bottom:24px}
  .reader-bar .back{text-decoration:none;color:var(--brand);font-weight:600;font-size:.92rem;white-space:nowrap}
  .reader-bar .back:hover{text-decoration:underline}
  .reader-bar h1{font-size:1.25rem;color:var(--brand);line-height:1.3;text-align:right;overflow-wrap:break-word}
  .state{background:var(--card);border:1.5px dashed var(--line);border-radius:var(--radius);
    padding:56px 24px;text-align:center;color:var(--muted)}
  .state h2{color:var(--brand);font-size:1.5rem;margin-bottom:8px}
  .state a{color:var(--brand);font-weight:600}
  .viewer{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    box-shadow:var(--shadow);padding:18px;text-align:center}
  .viewer img{margin:0 auto;max-height:78vh;width:auto;max-width:100%;object-fit:contain;border-radius:6px;
    background:radial-gradient(420px 320px at 50% 42%,#f8f1de,#e6d6ae)}
  [data-theme="dark"] .viewer img{background:radial-gradient(420px 320px at 50% 42%,#2a3322,#1b211a)}
  .viewer iframe{width:100%;height:78vh;border:0;border-radius:6px;background:var(--card)}
  .reader-controls{display:flex;align-items:center;justify-content:center;gap:18px;margin-top:18px;flex-wrap:wrap}
  .reader-controls .ind{font-weight:600;color:var(--muted);font-size:.92rem;min-width:110px;text-align:center}
  .btn{display:inline-block;border:0;cursor:pointer;text-decoration:none;font-weight:600;
    border-radius:999px;padding:12px 28px;font-size:.92rem;transition:transform .12s ease,box-shadow .12s ease;font-family:inherit}
  .btn:active{transform:scale(.97)}
  .btn-brand{background:var(--brand);color:#fff;box-shadow:var(--shadow)}
  .btn-brand:hover{background:var(--brand-dark)}
  .btn-brand[disabled]{opacity:.45;cursor:default;box-shadow:none}
  .btn-outline{background:transparent;color:var(--brand);border:1.5px solid var(--brand)}
  .btn-outline:hover{background:var(--brand);color:#fff}
  .open-link{text-align:center;margin-top:14px;font-size:.9rem;color:var(--muted)}
  .open-link a{color:var(--brand);font-weight:600}
  footer{background:#16241b;color:#b3ab96;text-align:center;padding:34px 20px;font-size:.88rem}
  footer .brand{color:#ecdfba;font-size:1.2rem}
  footer nav{margin:14px 0;display:flex;gap:20px;justify-content:center;flex-wrap:wrap}
  footer nav a{color:#b3ab96;text-decoration:none}
  footer nav a:hover{color:#fff}
  button{-webkit-tap-highlight-color:transparent;touch-action:manipulation}
  @media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<header>
  <div class="wrap-wide nav">
    <a class="brand" href="index.html">Ibnnak<small>Library</small></a>
    <nav class="nav-links">
      <a href="index.html">Home Page</a>
      <a href="books.html" class="here">Books</a>
      <a href="articles.html">Articles</a>
      <a href="quotations.html">Quotations</a>
      <a href="videos.html">Videos</a>
      <a href="palmistry.html">Palmistry</a>
    </nav>
    <button class="theme-btn" id="themeToggle" aria-label="Switch to dark mode"></button>
  </div>
</header>

<main>
  <div class="wrap-wide">
    <div class="reader-bar">
      <a class="back" id="backToBook" href="books.html">← Back to book</a>
      <h1 id="readerTitle">Read Online</h1>
    </div>
    <div id="readerRoot">
      <div class="state"><h2>Loading…</h2><p>Opening this book.</p></div>
    </div>
  </div>
</main>

<footer>
  <div class="wrap-wide">
    <div class="brand serif">Ibnnak</div>
    <nav>
      <a href="index.html">Home Page</a><a href="books.html">Books</a><a href="articles.html">Articles</a>
      <a href="quotations.html">Quotations</a><a href="videos.html">Videos</a><a href="palmistry.html">Palmistry</a>
    </nav>
    <div>© <span id="yr"></span> Ibnnak. All rights reserved.</div>
  </div>
</footer>

<script src="firebase-config.js"></script>
<script>
(function(){
  var MOON = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>';
  var SUN = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
  var btn = document.getElementById("themeToggle");
  function apply(t){
    document.documentElement.dataset.theme = t;
    try{ localStorage.setItem("abk_theme", t); }catch(e){}
    btn.innerHTML = t === "dark" ? SUN : MOON;
    btn.setAttribute("aria-label", t === "dark" ? "Switch to light mode" : "Switch to dark mode");
  }
  var saved = "light";
  try{ saved = localStorage.getItem("abk_theme") || "light"; }catch(e){}
  apply(saved);
  btn.addEventListener("click", function(){
    apply(document.documentElement.dataset.theme === "dark" ? "light" : "dark");
  });
  document.getElementById("yr").textContent = new Date().getFullYear();
})();
</script>
<script type="importmap">
{"imports":{
  "firebase/app":"https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js",
  "firebase/firestore":"https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js"
}}
</script>
<script type="module">
import { initializeApp } from "firebase/app";
import { getFirestore, getDoc, doc } from "firebase/firestore";

const root = document.getElementById("readerRoot");
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

function showState(title, text, bookId){
  const back = bookId ? `<p style="margin-top:14px"><a href="book.html?id=${encodeURIComponent(bookId)}">← Back to book</a></p>` : "";
  root.innerHTML = `<div class="state"><h2>${esc(title)}</h2><p>${esc(text)}</p>${back}</div>`;
}

function renderPageViewer(p, pages){
  let idx = 0;
  root.innerHTML = `
    <div class="viewer" id="pageViewer">
      <img id="pageImg" src="${esc(pages[0])}" alt="${esc(p.name)} — page 1">
      <div class="reader-controls">
        <button class="btn btn-brand" id="prevBtn">← Prev</button>
        <span class="ind" id="pageInd"></span>
        <button class="btn btn-brand" id="nextBtn">Next →</button>
      </div>
    </div>`;
  const img = document.getElementById("pageImg");
  const ind = document.getElementById("pageInd");
  const prev = document.getElementById("prevBtn");
  const next = document.getElementById("nextBtn");
  function paint(){
    img.src = pages[idx];
    img.alt = (p.name || "Book") + " — page " + (idx + 1);
    ind.textContent = "Page " + (idx + 1) + " of " + pages.length;
    prev.disabled = idx === 0;
    next.disabled = idx === pages.length - 1;
  }
  function go(d){
    const n = idx + d;
    if (n < 0 || n >= pages.length) return;
    idx = n; paint();
  }
  prev.onclick = () => go(-1);
  next.onclick = () => go(1);
  document.addEventListener("keydown", e => {
    if (e.key === "ArrowLeft") go(-1);
    else if (e.key === "ArrowRight") go(1);
  });
  const viewer = document.getElementById("pageViewer");
  let tx = null;
  viewer.addEventListener("touchstart", e => { tx = e.changedTouches[0].clientX; }, {passive:true});
  viewer.addEventListener("touchend", e => {
    if (tx === null) return;
    const dx = e.changedTouches[0].clientX - tx;
    if (Math.abs(dx) > 40) go(dx < 0 ? 1 : -1);
    tx = null;
  }, {passive:true});
  paint();
}

(async function(){
  const id = new URLSearchParams(location.search).get("id");
  if (!id){ showState("No book selected", "This link is missing its book. Head back to the Books page to browse the shelves."); return; }
  document.getElementById("backToBook").href = "book.html?id=" + encodeURIComponent(id);
  if (typeof FIREBASE_CONFIGURED === "undefined" || !FIREBASE_CONFIGURED){
    showState("Book not available yet", "The library is still being set up — please check back soon.", id);
    return;
  }
  try{
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app, "default");
    const snap = await getDoc(doc(db, "products", id));
    if (!snap.exists()){ showState("Book not found", "This book may have been moved or removed.", id); return; }
    const p = { id: snap.id, ...snap.data() };
    document.title = (p.name || "Book") + " — Read Online — Ibnnak";
    document.getElementById("readerTitle").textContent = p.name || "Read Online";
    if (p.readUrl){
      root.innerHTML = `
        <div class="viewer">
          <iframe src="${esc(p.readUrl)}" title="${esc(p.name)}" loading="lazy"></iframe>
        </div>
        <p class="open-link">The viewer is not loading? <a href="${esc(p.readUrl)}" target="_blank" rel="noopener">Open this book in a new tab</a></p>`;
      return;
    }
    const pages = (p.images && p.images.length ? p.images : (p.imageUrl ? [p.imageUrl] : []));
    if (!pages.length){
      showState("Not available to read online yet", "This book does not have readable pages yet — please check back soon.", id);
      return;
    }
    renderPageViewer(p, pages);
  }catch(e){
    console.warn("[Ibnnak] Could not load book for reading:", e.message);
    showState("Could not load this book", "Please check your connection and try again.", id);
  }
})();
</script>
</body>
</html>
