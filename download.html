<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Download — Ibnnak</title>
<meta name="description" content="Ibnnak — download this book file. Reading online is always free on Ibnnak.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f6f0e2; --card:#fffdf7; --ink:#232a22; --muted:#7d7466;
    --brand:#1f5138; --brand-dark:#143c29; --gold:#b97e1e; --gold-soft:#f0e3c0;
    --line:#e3d7bd;
    --shadow:0 10px 30px rgba(31,60,40,.10); --radius:14px;
    --header-bg:rgba(246,240,226,.94);
  }
  [data-theme="dark"]{
    --bg:#10160f; --card:#1a211a; --ink:#ede6d4; --muted:#a99e86;
    --brand:#6faf8b; --brand-dark:#589a76; --gold:#d9a94a; --gold-soft:#2e2a14;
    --line:#2e362c;
    --shadow:0 10px 30px rgba(0,0,0,.45);
    --header-bg:rgba(16,22,15,.94);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;background:var(--bg);color:var(--ink);line-height:1.65}
  h1,h2,.serif{font-family:'Fraunces',Georgia,'Times New Roman',serif}
  img{display:block;max-width:100%}
  a{color:inherit}
  .wrap{max-width:760px;margin:0 auto;padding:0 20px}
  .wrap-wide{max-width:1160px;margin:0 auto;padding:0 20px}
  header{position:sticky;top:0;z-index:50;background:var(--header-bg);
    backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
  .nav{display:flex;align-items:center;justify-content:space-between;height:68px;gap:16px}
  .brand{font-family:'Fraunces',Georgia,serif;font-size:1.45rem;font-weight:700;
    color:var(--brand);text-decoration:none;letter-spacing:.02em;flex:none}
  .brand small{display:block;font-family:'Inter',sans-serif;font-size:.62rem;font-weight:500;
    letter-spacing:.32em;color:var(--muted);text-transform:uppercase}
  .nav-links{display:flex;gap:20px}
  .nav-links a{text-decoration:none;font-size:.9rem;font-weight:500;color:var(--ink);opacity:.8;white-space:nowrap}
  .nav-links a:hover{opacity:1;color:var(--brand)}
  .nav-links a.here{opacity:1;color:var(--brand);font-weight:600}
  @media(max-width:900px){.nav-links{display:none}}
  .theme-btn{background:transparent;border:1.5px solid var(--line);color:var(--ink);
    width:42px;height:42px;border-radius:999px;cursor:pointer;display:inline-flex;
    align-items:center;justify-content:center;flex:none}
  .theme-btn:hover{border-color:var(--brand);color:var(--brand)}
  main{padding:56px 0 72px}
  .back{display:inline-block;text-decoration:none;color:var(--brand);font-weight:600;
    font-size:.9rem;margin-bottom:26px}
  .back:hover{text-decoration:underline}
  .state{background:var(--card);border:1.5px dashed var(--line);border-radius:var(--radius);
    padding:56px 24px;text-align:center;color:var(--muted)}
  .state h2{color:var(--brand);font-size:1.5rem;margin-bottom:8px}
  .state a{color:var(--brand);font-weight:600}
  .dl-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    box-shadow:var(--shadow);padding:28px}
  .dl-head{display:flex;gap:20px;align-items:center;margin-bottom:22px}
  .dl-head img{width:84px;height:112px;object-fit:cover;border-radius:8px;background:#eee3c8;flex:none}
  .dl-head .ph{width:84px;height:112px;border-radius:8px;background:linear-gradient(135deg,#eee3c8,#dfcfa6);
    display:flex;align-items:center;justify-content:center;font-size:.65rem;color:#8a7340;text-align:center;flex:none}
  [data-theme="dark"] .dl-head .ph,[data-theme="dark"] .dl-head img{background:linear-gradient(135deg,#263020,#1c241b)}
  .dl-head h1{font-size:1.55rem;line-height:1.25;color:var(--brand);overflow-wrap:break-word}
  .dl-head .by{color:var(--muted);font-style:italic;margin-top:4px}
  .dl-amount{font-size:1.6rem;font-weight:700;color:var(--brand);margin:6px 0 14px}
  .step-box{border-top:1px solid var(--line);padding-top:22px;margin-top:22px}
  .step-box h2{font-size:1.2rem;color:var(--brand);margin-bottom:10px}
  .step-box p{color:var(--muted);font-size:.95rem;margin-bottom:14px;white-space:pre-line}
  .btn{display:inline-block;border:0;cursor:pointer;text-decoration:none;font-weight:600;
    border-radius:999px;padding:14px 32px;font-size:.95rem;transition:transform .12s ease,box-shadow .12s ease;font-family:inherit}
  .btn:active{transform:scale(.97)}
  .btn-brand{background:var(--brand);color:#fff;box-shadow:var(--shadow)}
  .btn-brand:hover{background:var(--brand-dark)}
  .btn-brand[disabled]{opacity:.45;cursor:default;box-shadow:none;pointer-events:none}
  .btn-outline{background:transparent;color:var(--brand);border:1.5px solid var(--brand)}
  .btn-outline:hover{background:var(--brand);color:#fff}
  .note{font-size:.88rem;color:var(--muted);margin-top:16px}
  footer{background:#16241b;color:#b3ab96;text-align:center;padding:34px 20px;font-size:.88rem}
  footer .brand{color:#ecdfba;font-size:1.2rem}
  footer nav{margin:14px 0;display:flex;gap:20px;justify-content:center;flex-wrap:wrap}
  footer nav a{color:#b3ab96;text-decoration:none}
  footer nav a:hover{color:#fff}
  button{-webkit-tap-highlight-color:transparent;touch-action:manipulation}
  @media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<header>
  <div class="wrap-wide nav">
    <a class="brand" href="index.html">Ibnnak<small>Library</small></a>
    <nav class="nav-links">
      <a href="index.html">Home Page</a>
      <a href="books.html" class="here">Books</a>
      <a href="articles.html">Articles</a>
      <a href="quotations.html">Quotations</a>
      <a href="videos.html">Videos</a>
      <a href="palmistry.html">Palmistry</a>
    </nav>
    <button class="theme-btn" id="themeToggle" aria-label="Switch to dark mode"></button>
  </div>
</header>

<main>
  <div class="wrap">
    <a class="back" id="backToBook" href="books.html">← Back to book</a>
    <div id="dlRoot">
      <div class="state"><h2>Loading…</h2><p>Fetching this book.</p></div>
    </div>
  </div>
</main>

<footer>
  <div class="wrap-wide">
    <div class="brand serif">Ibnnak</div>
    <nav>
      <a href="index.html">Home Page</a><a href="books.html">Books</a><a href="articles.html">Articles</a>
      <a href="quotations.html">Quotations</a><a href="videos.html">Videos</a><a href="palmistry.html">Palmistry</a>
    </nav>
    <div>© <span id="yr"></span> Ibnnak. All rights reserved.</div>
  </div>
</footer>

<script src="firebase-config.js"></script>
<script>
(function(){
  var MOON = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>';
  var SUN = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
  var btn = document.getElementById("themeToggle");
  function apply(t){
    document.documentElement.dataset.theme = t;
    try{ localStorage.setItem("abk_theme", t); }catch(e){}
    btn.innerHTML = t === "dark" ? SUN : MOON;
    btn.setAttribute("aria-label", t === "dark" ? "Switch to light mode" : "Switch to dark mode");
  }
  var saved = "light";
  try{ saved = localStorage.getItem("abk_theme") || "light"; }catch(e){}
  apply(saved);
  btn.addEventListener("click", function(){
    apply(document.documentElement.dataset.theme === "dark" ? "light" : "dark");
  });
  document.getElementById("yr").textContent = new Date().getFullYear();
})();
</script>
<script type="importmap">
{"imports":{
  "firebase/app":"https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js",
  "firebase/firestore":"https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js"
}}
</script>
<script type="module">
import { initializeApp } from "firebase/app";
import { getFirestore, getDoc, doc } from "firebase/firestore";

const root = document.getElementById("dlRoot");
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmtAmount = n => "Rs " + Number(n || 0).toLocaleString("en-US");

function showState(title, text){
  root.innerHTML = `<div class="state"><h2>${esc(title)}</h2><p>${esc(text)}</p><p style="margin-top:14px"><a href="books.html">← Back to the Books page</a></p></div>`;
}

(async function(){
  const id = new URLSearchParams(location.search).get("id");
  if (!id){ showState("No book selected", "This link is missing its book. Head back to the Books page to browse the shelves."); return; }
  document.getElementById("backToBook").href = "book.html?id=" + encodeURIComponent(id);
  if (typeof FIREBASE_CONFIGURED === "undefined" || !FIREBASE_CONFIGURED){
    showState("Download not available yet", "The library is still being set up — please check back soon.");
    return;
  }
  try{
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const [snap, sSnap] = await Promise.all([
      getDoc(doc(db, "products", id)),
      getDoc(doc(db, "siteContent", "main"))
    ]);
    if (!snap.exists()){ showState("Book not found", "This book may have been moved or removed."); return; }
    const p = { id: snap.id, ...snap.data() };
    const siteData = sSnap.exists() ? sSnap.data() : {};
    const paymentNote = siteData.paymentNote || "";
    const paymentLink = siteData.paymentLink || "";
    document.title = "Download " + (p.name || "Book") + " — Ibnnak";
    const thumb = (p.images && p.images.length ? p.images[0] : (p.imageUrl || ""));
    const downloadPrice = (p.downloadPrice != null && Number(p.downloadPrice) > 0) ? Number(p.downloadPrice) : 0;
    const isFree = !downloadPrice;
    const downloadUrl = p.downloadUrl || "";

    /* Step 1 — payment (skipped visually when the download is free) */
    let step1 = "";
    if (isFree){
      step1 = `
      <div class="step-box">
        <h2>Step 1 — No payment needed</h2>
        <p>This download is free. You can skip straight to Step 2 below.</p>
      </div>`;
    } else if (paymentLink){
      step1 = `
      <div class="step-box">
        <h2>Step 1 — Pay</h2>
        ${paymentNote ? `<p>${esc(paymentNote)}</p>` : ""}
        <a class="btn btn-brand" href="${esc(paymentLink)}" target="_blank" rel="noopener">Pay &amp; Download</a>
      </div>`;
    } else if (paymentNote){
      step1 = `
      <div class="step-box">
        <h2>Step 1 — Pay</h2>
        <p id="payNote" style="display:none">${esc(paymentNote)}</p>
        <button class="btn btn-brand" id="payReveal">Pay &amp; Download</button>
      </div>`;
    } else {
      step1 = `
      <div class="step-box">
        <h2>Step 1 — Pay</h2>
        <p>Payment details are being set up — please check back soon.</p>
        <button class="btn btn-brand" disabled>Pay &amp; Download</button>
      </div>`;
    }

    /* Step 2 — the file link lives only on this page */
    const step2 = downloadUrl ? `
      <div class="step-box">
        <h2>Step 2 — Get your file</h2>
        <p>Already paid? → <a class="btn btn-outline" href="${esc(downloadUrl)}" target="_blank" rel="noopener">Download your book</a></p>
      </div>` : `
      <div class="step-box">
        <h2>Step 2 — Get your file</h2>
        <p>The download file for this book is not available yet.</p>
      </div>`;

    root.innerHTML = `
      <div class="dl-card">
        <div class="dl-head">
          ${thumb ? `<img src="${esc(thumb)}" alt="${esc(p.name)}">` : `<div class="ph">Ibnnak</div>`}
          <div>
            <h1>${esc(p.name || "")}</h1>
            ${p.author ? `<div class="by">by ${esc(p.author)}</div>` : ""}
          </div>
        </div>
        <div class="dl-amount">${isFree ? "Free download" : fmtAmount(downloadPrice)}</div>
        <p style="color:var(--muted)">Reading this book online is always free on Ibnnak. This page is only for getting your own copy of the file.</p>
        ${step1}
        ${step2}
        <p class="note">Note: after payment, your file is delivered via the download link in Step 2 on this page — keep this page open, or return to it from the book's page once you have paid.</p>
      </div>`;

    const revealBtn = document.getElementById("payReveal");
    if (revealBtn){
      revealBtn.onclick = () => {
        const note = document.getElementById("payNote");
        if (note) note.style.display = "block";
        revealBtn.disabled = true;
        revealBtn.textContent = "Follow the payment instructions above";
      };
    }
  }catch(e){
    console.warn("[Ibnnak] Could not load download page:", e.message);
    showState("Could not load this page", "Please check your connection and try again.");
  }
})();
</script>
</body>
</html>
